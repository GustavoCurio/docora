name: Testes e avaliação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCORA_DISABLE_EMBEDDINGS: '1'
      DOCORA_ALLOW_MODEL_DOWNLOAD: '0'
      DOCORA_DISABLE_RERANKER: '1'
      DOCORA_RERANKER: none
      DOCORA_RETRIEVER: tfidf
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not slow'
      - run: python -m docora evaluate --suite original --retriever tfidf --output reports/ci-evaluation.json
      - run: python -m docora evaluate --suite all --retriever hybrid --allow-failures --output reports/ci-fallback.json
